<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- No network, no frames, no forms: the page only ever shows the text it was given. Scripts and styles come
     from this folder; pictures only as data: URLs (the styles allow inline rules because Mermaid writes them). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="style.css">
<script src="markdown-it.min.js"></script>
<script src="render.js"></script>
</head>
<body>
<div id="content" class="markdown-body"></div>
</body>
</html>
