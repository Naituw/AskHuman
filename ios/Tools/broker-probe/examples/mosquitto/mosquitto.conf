# AskHuman iOS channel: reference configuration for a self-hosted Mosquitto 2.x.
# Written and tested against Mosquitto 2.1.2; examples/mosquitto/README.md says what was tested and how.
#
# Replace the certificate and password paths with your own. The apps need a certificate that browsers
# trust (a public CA such as Let's Encrypt): a self-signed one makes the connection fail.

# Login and access rules are global, so both listeners below use the same ones.
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# Retained messages carry the "online" / "offline" state of your Mac and phone; keep them across restarts.
persistence true
persistence_location /var/lib/mosquitto/

# MQTT over TLS: what the Mac and the phone try first.
listener 8883
protocol mqtt
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem

# MQTT over WebSocket over TLS: the fallback for networks that only let web traffic through. Optional.
# Needs a Mosquitto built with WebSocket support (the Debian, Ubuntu and Homebrew packages are).
# The apps connect to the path /mqtt on this port.
listener 8084
protocol websockets
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem

# Nothing to set for message size: the channel's largest message is 900,000 bytes and Mosquitto has no
# limit by default. If you set message_size_limit or max_packet_size, keep it above 1,000,000.
