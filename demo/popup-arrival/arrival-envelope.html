<div id="arrival-icon-comparison" class="viz-carousel" aria-label="提示图标组合" data-previous-label="上一个图标" data-next-label="下一个图标">
<section data-variant="柔光瓷面">
<div id="askhuman-arrival-demo">
  <div class="viz-controls" aria-label="到达动画预览">
    <label class="form-label">初始状态 <select class="form-select" data-control="scenario"><option value="expanded">侧栏已展开</option><option value="collapsed">侧栏尚未展开</option></select></label>
    <button class="btn btn-primary" type="button" data-action="play">新提问到达</button>
    <button class="btn" type="button" data-action="delay">3 秒后到达</button>
    <label class="form-check"><input class="form-check-input" type="checkbox" data-control="covered"><span class="form-check-label">被其他窗口遮挡</span></label>
    <label class="form-check"><input class="form-check-input" type="checkbox" data-control="slow"><span class="form-check-label">慢放</span></label>
  </div>
  <div class="arrival-stage viz-dotted-background" aria-label="AskHuman 作答窗口预览">
    <section class="arrival-window" aria-label="AskHuman" data-expanded="true">
      <div class="arrival-traffic" aria-hidden="true"><span></span><span></span><span></span></div>
      <aside class="arrival-sidebar" aria-label="待回答提问"><header>待回答 <span data-count>3</span></header><nav data-navigation></nav></aside>
      <main class="arrival-main">
        <header class="arrival-header"><div class="arrival-brand"><i data-lucide="circle-help" aria-hidden="true"></i><span>来自 <b>Codex</b> 的提问</span></div><span class="arrival-project">HumanInLoop</span><span class="arrival-time">刚刚</span></header>
        <div class="arrival-content">
          <h2 data-question-title>确认窗口合并后的交互</h2>
          <p data-question-body>多个 Agent 的提问会放在同一个窗口里。你可以先完成当前回答，再处理新到达的提问。</p>
          <div class="arrival-options" role="group" aria-label="回答选项">
            <button class="arrival-option cursor-interaction" type="button" aria-pressed="true"><span class="arrival-radio"></span><span>保留当前提问和输入内容</span><small>推荐</small></button>
            <button class="arrival-option cursor-interaction" type="button" aria-pressed="false"><span class="arrival-radio"></span><span>切换到最新到达的提问</span></button>
          </div>
        </div>
        <div class="arrival-composer">
          <label class="arrival-editor-label" for="arrival-reply">补充说明</label>
          <textarea id="arrival-reply" rows="3" placeholder="输入补充说明…">新提问到达时，我正在写这段回复。光标和键盘输入应该继续保持在这里。</textarea>
          <div class="arrival-footer"><button class="arrival-attach cursor-interaction" type="button" aria-label="添加附件"><i data-lucide="paperclip" aria-hidden="true"></i></button><span>⌘ Enter 发送</span><button class="arrival-send cursor-interaction" type="button">发送回答 <i data-lucide="arrow-up" aria-hidden="true"></i></button></div>
        </div>
      </main>
      <div class="arrival-overlay" aria-hidden="true" data-overlay></div>
    </section>
    <section class="arrival-cover" aria-label="模拟另一个应用窗口" hidden>
      <header><span aria-hidden="true">● ● ●</span> 工作笔记</header><label for="arrival-external-editor">其他应用中的输入</label>
      <textarea id="arrival-external-editor" rows="3">我在另一个应用里输入，新提问会让 AskHuman 前置，但输入焦点仍然留在这里。</textarea>
    </section>
  </div>
  <div class="arrival-demo-status"><span data-status role="status" aria-live="polite">等待新提问</span><span data-timing>出现 220 · 停留 500 · 飞入 560 ms</span></div>
</div>
</section>
</div>
<style>

</style>
<script>
(() => {
  const original = document.getElementById('askhuman-arrival-demo');
  const carousel = document.getElementById('arrival-icon-comparison');
  const variants = [
    { id: 'solid', name: '柔光瓷面', icon: 'message-circle-question-mark', badge: false, solid: true, contrast: 'porcelain' },
    { id: 'lifted', name: '高悬浮', icon: 'message-circle-question-mark', badge: false, solid: true, contrast: 'lifted' },
    { id: 'rim', name: '立体薄边', icon: 'message-circle-question-mark', badge: false, solid: true, contrast: 'rim' },
    { id: 'reference', name: '原白色悬浮', icon: 'message-circle-question-mark', badge: false, solid: true, contrast: 'white' }
  ];
  for (const variant of variants) {
    let root = original;
    if (variant.id !== 'solid') {
      root = original.cloneNode(true);
      root.id = `askhuman-arrival-${variant.id}`;
      for (const node of root.querySelectorAll('[id]')) node.id += `-${variant.id}`;
      for (const label of root.querySelectorAll('label[for]')) label.htmlFor += `-${variant.id}`;
      const section = document.createElement('section');
      section.dataset.variant = variant.name; section.hidden = true;
      section.append(root); carousel.append(section);
    }
    root.setAttribute('aria-label', variant.name);
    root.dataset.contrast = variant.contrast;
    initDemo(root, variant);
  }
  function initDemo(root, variant) {
  const query = selector => root.querySelector(selector);
  const windowEl = query('.arrival-window'), overlay = query('[data-overlay]');
  const navigation = query('[data-navigation]'), editor = query('.arrival-composer textarea');
  const cover = query('.arrival-cover'), scenario = query('[data-control="scenario"]'), status = query('[data-status]');
  const preferences = { appear: 220, hold: 500, fly: 560, size: 88 };
  const initialDraft = editor.value, initialTitle = query('[data-question-title]').textContent, initialBody = query('[data-question-body]').textContent;
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  let items = [], selected = 'current', frame = 0, timeout = 0, generation = 0, sequence = 0;
  const clamp = t => Math.max(0, Math.min(1, t));
  const ease = t => { t = clamp(t); return t * t * t * (t * (t * 6 - 15) + 10); };
  const mix = (a, b, t) => a + (b - a) * t;

  function renderNavigation() {
    navigation.replaceChildren();
    for (const project of [...new Set(items.map(item => item.project))]) {
      const group = items.filter(item => item.project === project);
      const label = document.createElement('div'); label.className = 'arrival-group-label'; label.textContent = project;
      const count = document.createElement('span'); count.textContent = group.length; label.append(count); navigation.append(label);
      for (const item of group) {
        const row = document.createElement('button'); row.type = 'button'; row.className = 'arrival-row cursor-interaction';
        row.dataset.requestId = item.id; row.setAttribute('aria-current', String(selected === item.id));
        if (item.unread) row.classList.add('is-unread');
        row.innerHTML = '<span class="arrival-row-wash"></span><span class="arrival-dot"></span><span class="arrival-row-copy"><strong></strong><small></small></span>';
        row.querySelector('strong').textContent = item.title;
        row.querySelector('small').textContent = `${item.agent} · 提问${item.id === 'current' ? ' · 草稿' : ''}`;
        row.addEventListener('click', () => selectItem(item.id)); navigation.append(row);
      }
    }
    query('[data-count]').textContent = items.length;
  }
  function selectItem(id) {
    const previous = items.find(item => item.id === selected); if (previous) previous.draft = editor.value;
    const item = items.find(item => item.id === id); if (!item) return;
    selected = id; item.unread = false;
    query('[data-question-title]').textContent = item.title;
    query('[data-question-body]').textContent = id === 'current' ? initialBody : '这条提问已经放在侧栏里。当前正在编辑的内容会保存在原来的提问中。';
    editor.value = item.draft || ''; renderNavigation();
  }
  function cancelAnimation() { generation++; cancelAnimationFrame(frame); clearTimeout(timeout); overlay.replaceChildren(); }
  function updateTiming() { query('[data-timing]').textContent = `出现 ${preferences.appear} · 停留 ${preferences.hold} · 飞入 ${preferences.fly} ms`; }
  function reset() {
    cancelAnimation();
    const oldDraft = items.find(item => item.id === 'current')?.draft;
    const currentDraft = selected === 'current' ? editor.value : oldDraft || initialDraft;
    selected = 'current';
    items = [{ id: 'current', title: initialTitle, project: 'HumanInLoop', agent: 'Codex', unread: false, draft: currentDraft }];
    if (scenario.value === 'expanded') items.push(
      { id: 'existing', title: '选择附件预览的打开方式', project: 'HumanInLoop', agent: 'Claude Code', unread: false, draft: '' },
      { id: 'website', title: '确认首页内容的布局', project: 'Website', agent: 'Codex', unread: false, draft: '' }
    );
    windowEl.dataset.expanded = String(scenario.value === 'expanded');
    // Avoid assigning an unchanged value: arrival must preserve the caret and selection.
