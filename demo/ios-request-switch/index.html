<style>

m:1px solid #f0f0f4;min-height:84px}.message:last-child{border:0}.message.current{background:#ecf4ff}.message .avatar{width:34px;height:34px;border-radius:10px;font-size:21px}.messagebody{flex:1;min-width:0}.messagetitle{font-size:14px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.messagedetail{font-size:11px;color:#8a8f98;margin-top:6px}.kind{font-size:10px;color:#737e8a;font-weight:450;margin-left:5px}.draftmark{display:inline-block;font-size:10px;color:#0983ee;margin-top:4px}.check{width:18px;font-size:17px;color:#0785ff}.sheetnote{font-size:11px;color:#8d929b;text-align:center;margin-top:16px}.notes{position:absolute;left:48px;right:48px;top:1740px}.notes .tag{font-size:17px;font-weight:650;color:#1478cf;margin-bottom:11px}.notes p{font-size:19px;line-height:1.55;color:#616b78;margin:0}.sheetboard .notes{top:1735px}.render .controls{display:none}.pointer{position:absolute;width:33px;height:33px;background:#1989ff2a;border:2px solid #1989ff80;border-radius:50%;z-index:8;display:none;pointer-events:none}.muted{color:#a4a8ae}.screenlabel{position:absolute;top:155px;right:48px;font-size:13px;color:#88919d}
.compact-switch,.next-only{display:none;position:absolute;top:69px;height:42px}.compact-switch{left:157px;width:106px;padding:0 4px;align-items:center;justify-content:space-between;box-shadow:0 5px 18px #1d304b12}.compact-switch button{display:flex;align-items:center;justify-content:center;width:46px;height:42px;background:transparent;border-radius:23px;color:#147ce4}.compact-switch button:disabled{color:#b5bdc8}.compact-switch svg{width:16px;height:16px;stroke-width:2.1}.next-only{left:153px;width:114px;font-size:15px;font-weight:550;align-items:center;justify-content:center;gap:12px;color:#147ce4}.next-only svg{width:13px;height:13px;stroke-width:2.2}.variant-d .compact-switch{display:flex}.variant-e .next-only{display:flex}.moment-count{display:none;position:absolute;top:116px;width:100%;text-align:center;font-size:10px;color:#979eaa;pointer-events:none}.show-position .moment-count{display:block}
</style>
<div class="controls"><button onclick="setVariant('a')">A 顶部单入口</button><button onclick="setVariant('b')">B 底部快切</button><button onclick="setVariant('c')">C 底部单入口</button><button onclick="setTyping(!typing)">键盘</button><button onclick="openDrawer()">消息抽屉</button></div>
<main class="board">
 <div class="caption"><div class="eyebrow">ASKHUMAN · iOS 消息切换候选</div><h1 id="headline"></h1><p id="subtitle"></p></div>
 <div class="screenlabel">界面原型 · 尚未接入 App</div>
 <section class="phone variant-a" id="phone">
  <img class="native" src="assets/request.png" alt="当前 App 的 mock 界面基底">
  <div class="body"><div class="request">
   <div class="header"><div class="avatar" id="avatar">✳</div><div><div class="agent" id="agent">Claude Code</div><div class="sub" id="origin">relay · Office iMac</div><div class="date">今天 17:30</div></div></div>
   <div class="card intro"><p id="intro"></p></div>
   <div class="card questioncard"><h2 class="question" id="question"></h2><div id="options"></div></div>
   <div class="card inputcard"><div class="inputlabel">补充说明<span>草稿自动保留</span></div><textarea id="draft" placeholder="输入补充说明…"></textarea><div class="attachment">♧　添加照片或文件</div></div>
  </div></div>
  <button class="glass top-entry" onclick="openDrawer()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="7" width="15" height="14" rx="3"/><path d="M16 3H5a3 3 0 0 0-3 3v10"/></svg><span>待答 5</span><span class="chev">⌄</span></button>
  <div class="glass compact-switch"><button class="compact-prev" onclick="move(-1)" aria-label="上一条消息"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m6 15 6-6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="compact-next" onclick="move(1)" aria-label="下一条消息"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m6 9 6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
  <button class="glass next-only" onclick="cycle()">下一条<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m9 6 6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="moment-count"><span class="position">2 / 5</span></div>
  <div class="footer"><div class="glass rail"><button class="prev" onclick="move(-1)">‹　上一条</button><button class="middle" onclick="openDrawer()">待答 <span class="position">2 / 5</span>　⌃</button><button class="next" onclick="move(1)">下一条　›</button></div><div class="mainrow"><button class="glass stack-button" onclick="openDrawer()" aria-label="切换待答消息"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="7" width="15" height="14" rx="3"/><path d="M16 3H5a3 3 0 0 0-3 3v10"/></svg><span class="badge">5</span></button><div class="glass count">已回答 <span id="answercount">0</span>/1</div><button class="glass primary" id="primary">发送 ↑</button></div></div>
  <div class="keyboard"><img src="assets/keyboard.png" alt="系统键盘示意"></div><div class="home"></div>
  <button class="scrim" onclick="closeDrawer()" aria-label="关闭抽屉"></button>
  <div class="sheet"><div class="handle"></div><div class="sheethead"><strong>待答消息 <span style="color:#9197a2;font-weight:450">5</span></strong><button onclick="closeDrawer()" aria-label="关闭">×</button></div><div class="scope">全部待答 · 可直接切换，当前草稿会保留</div><div class="messages" id="messages"></div><div class="sheetnote">蓝色勾选表示当前消息</div></div>
 </section>
 <div class="notes"><div class="tag" id="tag"></div><p id="note"></p></div>
</main>
<script>
const phone=document.getElementById('phone');let variant='a',typing=false,index=1;
const drafts={},selected={};
const data=[
 {agent:'Codex',origin:'HumanInLoop · Home MacBook Pro',avatar:'◎',color:'#5486ed',title:'收尾 iOS 通知与设置',kind:'提问',intro:'通知与连接状态已更新，接下来需要确认发布范围。',question:'这次先发布到内部 TestFlight 吗？',options:['先发内部测试','再补一轮检查']},
 {agent:'Claude Code',origin:'relay · Office iMac',avatar:'✳',color:'#e38c6c',title:'修复 Node 22 的 CI',kind:'提问',intro:'测试在 Node 20 上通过，在 Node 22 上有 2 个失败。',question:'要把 CI 矩阵固定在 Node 20 吗？',options:['固定在 Node 20','继续修复 Node 22']},
 {agent:'Cursor',origin:'HumanInLoop · Home MacBook Pro',avatar:'◆',color:'#23252a',title:'Plan the users table migration',kind:'提问',intro:'迁移方案已经整理，在线双写和停机迁移都可行。',question:'先验证哪种迁移方式？',options:['在线双写','停机迁移']},
 {agent:'Claude Code',origin:'HumanInLoop · Home MacBook Pro',avatar:'✳',color:'#e38c6c',title:'Fix the flaky login tests',kind:'权限',intro:'Agent 请求运行测试脚本。',question:'允许执行 npm test 吗？',options:['允许这一次','拒绝']},
 {agent:'Cursor',origin:'relay · Office iMac',avatar:'◆',color:'#23252a',title:'检查限流与错误映射',kind:'Stop',intro:'已完成限流与错误映射，测试全部通过。',question:'Agent 想结束本轮工作',options:['结束','继续工作']}
];
const designs={
 a:{title:'A · 顶部只有一枚入口',subtitle:'点「待答 5」→ 选消息，2 次点按',tag:'适合：优先保持底部清爽',note:'没有常驻箭头，不增加阅读栏高度。入口较高，单手够到会稍费力。'},
 b:{title:'B · 底部直接快切',subtitle:'上一条／下一条，1 次点按',tag:'推荐：优先解决反复切换',note:'顶部完全不增加控件；点中间数字也能任选消息。代价是底部多占一行。'},
 d:{title:'D · 顶部一组小箭头',subtitle:'双向直接切换，各点一次',tag:'推荐：双向切换，保持作答区原样',note:'只增加一组紧凑图标。上箭头看上一条，下箭头看下一条；编号只在切换后短暂出现。'},
 e:{title:'E · 只有一枚“下一条”',subtitle:'点一次换一条，末尾回到第一条',tag:'取舍：控件更少，只有一个方向',note:'入口与动作合一。适合按顺序轮看；想回到刚才那条时，要继续轮到它。'},
 c:{title:'C · 底部一枚消息按钮',subtitle:'点叠卡按钮 → 选消息，2 次点按',tag:'适合：保持顶导与阅读高度',note:'入口放在拇指附近，不额外增加一行。消息多时可直达；底部作答栏稍拥挤。'}
};
function setVariant(v){variant=v;phone.classList.remove('variant-a','variant-b','variant-c','variant-d','variant-e');phone.classList.add('variant-'+v);closeDrawer();const d=designs[v];headline.textContent=d.title;subtitle.textContent=d.subtitle;tag.textContent=d.tag;note.textContent=d.note;render();}
function setTyping(v){typing=v;phone.classList.toggle('typing',v);closeDrawer();if(v&&!drafts[index])drafts[index]='先保留 Node 20，Node 22 单独修复。';render();}
function render(){const d=data[index];agent.textContent=d.agent;document.getElementById('origin').textContent=d.origin;avatar.textContent=d.avatar;avatar.style.background=d.color;intro.textContent=d.intro;question.textContent=d.question;draft.value=drafts[index]||'';options.replaceChildren(...d.options.map((text,i)=>{const b=document.createElement('button');b.className='option'+(selected[index]===i?' selected':'');const radio=document.createElement('span');radio.className='radio';b.append(radio,document.createTextNode(text));b.onclick=()=>{selected[index]=i;render()};return b;}));document.querySelectorAll('.position').forEach(e=>e.textContent=`${index+1} / 5`);document.querySelectorAll('.prev,.compact-prev').forEach(b=>b.disabled=index===0);document.querySelectorAll('.next,.compact-next').forEach(b=>b.disabled=index===4);answercount.textContent=selected[index]!=null||drafts[index]?'1':'0';primary.textContent=d.kind==='提问'?'发送 ↑':'提交 ↑';messages.replaceChildren(...data.map((m,i)=>{const b=document.createElement('button');b.className='message'+(i===index?' current':'');b.innerHTML=`<div class="avatar" style="background:${m.color}">${m.avatar}</div><div class="messagebody"><div class="messagetitle">${m.title}</div><div class="messagedetail">${m.agent} · ${m.origin}<span class="kind">${m.kind}</span></div>${drafts[i]||selected[i]!=null?'<span class="draftmark">有草稿</span>':''}</div><span class="check">${i===index?'✓':''}</span>`;b.onclick=()=>select(i);return b;}));}
function move(n){select(Math.max(0,Math.min(4,index+n)))}function cycle(){select((index+1)%5)}function select(i){drafts[index]=draft.value;index=i;closeDrawer();render();if(variant==='d'||variant==='e'){phone.classList.add('show-position');clearTimeout(window.countTimeout);window.countTimeout=setTimeout(()=>phone.classList.remove('show-position'),1200)}}function openDrawer(){drafts[index]=draft.value;render();phone.classList.add('drawer')}function closeDrawer(){phone.classList.remove('drawer')}draft.addEventListener('input',()=>drafts[index]=draft.value);
window.designPrototype={setVariant,setTyping,openDrawer,closeDrawer,select,move,reset(){typing=false;phone.classList.remove('typing','drawer','show-position');index=1;for(const k of Object.keys(drafts))delete drafts[k];for(const k of Object.keys(selected))delete selected[k];render();},state:()=>({variant,typing,index,draft:draft.value})};setVariant(new URLSearchParams(location.search).get('variant')||'a');if(location.search.includes('render'))document.body.classList.add('render');window.prototypeReady=true;
</script>
</html>
