<!DOCTYPE html>
<html lang="zh-CN">

  <style>

      margin: 0;
      height: 100%;

      overflow: hidden;

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

</head>

  <!-- Side-view scene. The script turns the cranks, solves the legs, and scrolls the shore. -->

      <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">

        <stop offset="100%" stop-color="#2f86a8"/>

      <linearGradient id="sandGrad" x1="0" y1="0" x2="0" y2="1">

        <stop offset="58%" stop-color="#f6f3ec"/>
        <stop offset="100%" stop-color="#e4dcd0"/>

      <g id="tuft" stroke="#3e8a32" fill="none" stroke-width="2" stroke-linecap="round">

        <path d="M0,0 C5,-14 3,-20 7,-27"/>

      <g id="flower">

    <rect width="1200" height="640" fill="url(#skyGrad)"/>

    <rect x="0" y="434" width="1200" height="62" fill="url(#sandGrad)"/>

          <ellipse cx="0" cy="3" rx="7" ry="2.6" fill="#d08a4e"/>

        <g id="fish" transform="translate(22,20)">
          <g id="fish-spin">
            <polygon points="-12,-4 -12,4 -4,0" fill="#4aa3c8"/>
            <ellipse cx="2" cy="0" rx="10" ry="5.2" fill="#5eb0d4"/>
            <path d="M-1,-2.4 C4,-1 4,1 -1,2.4" fill="none" stroke="#f4fbff" stroke-width="1.1" opacity="0.85"/>
            <circle cx="8" cy="-1.1" r="1.05" fill="#163040"/>
            <circle cx="8.3" cy="-1.4" r="0.35" fill="#fff"/>
          </g>
        </g>
      </g>
    </g>

    <text x="40" y="52" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, sans-serif" font-size="26" font-weight="700" fill="#1a4c66">鹈鹕骑自行车</text>
  </svg>

  <script>
    (function () {
      "use strict";

      var SPEED = 210;
      var WHEEL_R = 50;
      var CADENCE = 1.05;
      var PHASE = 0.6;
      var PERIOD = 1200;
      var BBX = 74;
      var BBY = -34;
      var CRANK = 22;
      var HIP_X = 52;
      var HIP_Y = -148;
      var THIGH = 78;
      var SHIN = 74;

      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      var cloudScroll = document.getElementById("cloud-scroll");
      var shoreScroll = document.getElementById("shore-scroll");
      var waveScroll = document.getElementById("wave-scroll");
      var beachScroll = document.getElementById("beach-scroll");
      var pathScroll = document.getElementById("path-scroll");
      var grassScroll = document.getElementById("grass-scroll");
      var lane = document.getElementById("lane");
      var rays = document.getElementById("rays");
      var shadow = document.getElementById("shadow");
      var rearSpin = document.getElementById("rear-spin");
      var frontSpin = document.getElementById("front-spin");
      var chainTop = document.getElementById("chain-top");
      var chainBot = document.getElementById("chain-bot");
      var chainring = document.getElementById("chainring");
      var farThigh = document.getElementById("far-thigh");
      var farShin = document.getElementById("far-shin");
      var farKnee = document.getElementById("knee-far");
      var farCrank = document.getElementById("far-crank");
      var pedalFar = document.getElementById("pedal-far");
      var nearThigh = document.getElementById("near-thigh");
      var nearShin = document.getElementById("near-shin");
      var nearKnee = document.getElementById("knee-near");
      var nearCrank = document.getElementById("near-crank");
      var pedalNear = document.getElementById("pedal-near");
      var bird = document.getElementById("bird");
      var wing = document.getElementById("wing");
      var tail = document.getElementById("tail");
      var head = document.getElementById("head");
      var eye = document.getElementById("eye");
      var pouch = document.getElementById("pouch");
      var fishSpin = document.getElementById("fish-spin");
      var bell = document.getElementById("bell");

      function mod(n, m) {
        return ((n % m) + m) % m;
      }

      // Two-bone IK. The knee stays forward of the hip so the stroke reads as pedaling.
      function solveKnee(hip, ankle) {
        var dx = ankle.x - hip.x;
        var dy = ankle.y - hip.y;
        var dist = Math.hypot(dx, dy) || 0.0001;
        var max = THIGH + SHIN - 0.01;
        var min = Math.abs(THIGH - SHIN) + 0.01;
        if (dist > max) {
          dx *= max / dist;
          dy *= max / dist;
          dist = max;
        } else if (dist < min) {
          dx *= min / dist;
          dy *= min / dist;
          dist = min;
        }
        var ax = hip.x + dx;
        var ay = hip.y + dy;
        var h = (THIGH * THIGH - SHIN * SHIN + dist * dist) / (2 * dist);
        var perp = Math.sqrt(Math.max(0, THIGH * THIGH - h * h));
        var ux = dx / dist;
        var uy = dy / dist;
        var bx = hip.x + ux * h;
        var by = hip.y + uy * h;
        var px = -uy * perp;
        var py = ux * perp;
        var kA = { x: bx + px, y: by + py };
        var kB = { x: bx - px, y: by - py };
        var scoreA = -kA.y + kA.x * 0.35;
        var scoreB = -kB.y + kB.x * 0.35;
        var knee = scoreA >= scoreB ? kA : kB;
        return { knee: knee, ankle: { x: ax, y: ay } };
      }

      function setLine(el, a, b) {
        el.setAttribute("x1", a.x.toFixed(2));
        el.setAttribute("y1", a.y.toFixed(2));
        el.setAttribute("x2", b.x.toFixed(2));
        el.setAttribute("y2", b.y.toFixed(2));
      }

      function footAt(angle) {
        return {
          x: BBX + Math.cos(angle) * CRANK,
          y: BBY + Math.sin(angle) * CRANK
        };
      }

      function blinkScale(t) {
        var p = t % 4.2;
        function pulse(center) {
          var d = Math.abs(p - center);
          if (d > 0.08) return 1;
          return Math.max(0.08, d / 0.08);
        }
        return Math.min(pulse(3.5), pulse(3.74));
      }

      function draw(t) {
        var dist = t * SPEED;
        var wheelDeg = (dist / WHEEL_R) * (180 / Math.PI);
        var crankRad = t * CADENCE * Math.PI * 2 + PHASE;
        var crankDeg = crankRad * (180 / Math.PI);
        var bob = Math.sin(crankRad * 2) * 2.4;
        var hip = { x: HIP_X, y: HIP_Y + bob };
        var near = footAt(crankRad);
        var far = footAt(crankRad + Math.PI);
        var nearLeg = solveKnee(hip, near);
        var farLeg = solveKnee(hip, far);

        cloudScroll.setAttribute("transform", "translate(" + (-mod(dist * 0.1, PERIOD)).toFixed(1) + " " + (Math.sin(t * 0.35) * 5).toFixed(2) + ")");
        shoreScroll.setAttribute("transform", "translate(" + (-mod(dist * 0.18, PERIOD)).toFixed(1) + " 0)");
        waveScroll.setAttribute("transform", "translate(" + (-mod(dist * 0.32, PERIOD)).toFixed(1) + " 0)");
        beachScroll.setAttribute("transform", "translate(" + (-mod(dist * 0.48, PERIOD)).toFixed(1) + " 0)");
        pathScroll.setAttribute("transform", "translate(" + (-mod(dist, PERIOD)).toFixed(1) + " 0)");
        grassScroll.setAttribute("transform", "translate(" + (-mod(dist * 1.18, PERIOD)).toFixed(1) + " 0)");
        lane.setAttribute("stroke-dashoffset", dist.toFixed(1));

        rays.setAttribute("transform", "rotate(" + (t * 8).toFixed(2) + ")");
        rearSpin.setAttribute("transform", "rotate(" + wheelDeg.toFixed(2) + ")");
        frontSpin.setAttribute("transform", "rotate(" + wheelDeg.toFixed(2) + ")");
        chainTop.setAttribute("stroke-dashoffset", (dist * 0.32).toFixed(1));
        chainBot.setAttribute("stroke-dashoffset", (-dist * 0.32).toFixed(1));
        chainring.setAttribute("transform", "rotate(" + crankDeg.toFixed(2) + " " + BBX + " " + BBY + ")");

        setLine(farCrank, { x: BBX, y: BBY }, far);
        setLine(farThigh, hip, farLeg.knee);
        setLine(farShin, farLeg.knee, farLeg.ankle);
        farKnee.setAttribute("cx", farLeg.knee.x.toFixed(2));
        farKnee.setAttribute("cy", farLeg.knee.y.toFixed(2));
        pedalFar.setAttribute("transform", "translate(" + far.x.toFixed(2) + " " + far.y.toFixed(2) + ")");

        setLine(nearCrank, { x: BBX, y: BBY }, near);
        setLine(nearThigh, hip, nearLeg.knee);
        setLine(nearShin, nearLeg.knee, nearLeg.ankle);
        nearKnee.setAttribute("cx", nearLeg.knee.x.toFixed(2));
        nearKnee.setAttribute("cy", nearLeg.knee.y.toFixed(2));
        pedalNear.setAttribute("transform", "translate(" + near.x.toFixed(2) + " " + near.y.toFixed(2) + ")");

        var lift = (bob + 2.4) / 4.8;
        shadow.setAttribute("rx", (128 - lift * 10).toFixed(2));
        shadow.setAttribute("opacity", (0.18 - lift * 0.05).toFixed(3));

        bird.setAttribute("transform", "translate(0 " + bob.toFixed(2) + ")");
        wing.setAttribute("transform", "rotate(" + (Math.sin(crankRad) * 3.5).toFixed(2) + " 18 -176)");
        tail.setAttribute("transform", "rotate(" + (Math.sin(t * 6.2) * 4).toFixed(2) + " -20 -166)");
        head.setAttribute("transform", "rotate(" + (Math.sin(t * 1.6) * 2.4 + Math.sin(crankRad) * 0.7).toFixed(2) + " 110 -230)");
        eye.setAttribute("transform", "translate(116 -236) scale(1 " + blinkScale(t).toFixed(3) + ") translate(-116 236)");
        var pouchScale = 1 + Math.sin(t * 5.2) * 0.045;
        pouch.setAttribute("transform", "translate(168 -214) scale(1 " + pouchScale.toFixed(3) + ") translate(-168 214)");
        fishSpin.setAttribute("transform", "rotate(" + (Math.sin(t * 7) * 8).toFixed(2) + ")");
        bell.setAttribute("transform", "translate(158 -160) rotate(" + (Math.sin(t * 9) * 7).toFixed(2) + ")");
      }

      draw(0);
      if (!reduce) {
        var t0 = performance.now();
        var loop = function (now) {
          draw((now - t0) / 1000);
          requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
      }
    })();
  </script>
</body>
</html>
